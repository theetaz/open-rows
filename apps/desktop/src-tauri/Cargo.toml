[package]
name = "openrows-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "openrows-app"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arrow-array = "60"
arrow-schema = "60"
openrows-core = { path = "../../../crates/openrows-core" }
openrows-driver-api = { path = "../../../crates/openrows-driver-api" }
openrows-driver-mysql = { path = "../../../crates/openrows-driver-mysql" }
openrows-driver-postgres = { path = "../../../crates/openrows-driver-postgres" }
openrows-driver-sqlite = { path = "../../../crates/openrows-driver-sqlite" }
openrows-export = { path = "../../../crates/openrows-export" }
openrows-import = { path = "../../../crates/openrows-import" }
openrows-net = { path = "../../../crates/openrows-net" }
openrows-results = { path = "../../../crates/openrows-results" }
openrows-schema = { path = "../../../crates/openrows-schema" }
openrows-secrets = { path = "../../../crates/openrows-secrets" }
openrows-sql = { path = "../../../crates/openrows-sql" }
openrows-store = { path = "../../../crates/openrows-store" }
openrows-types = { path = "../../../crates/openrows-types" }
serde = { workspace = true, features = ["derive"] }
tauri = { version = "2", features = ["specta", "macos-private-api"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
thiserror.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio = { version = "1.53", features = ["sync", "time"] }
tauri-plugin-window-state = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
regex = "1.13.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "json"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSApplication", "NSResponder", "NSWindow", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "time", "std"] }
