[package]
name = "openrows-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "openrows-app"

[features]
ipc-bindings = []

[[bin]]
name = "gen-ipc"
path = "src/bin/gen-ipc.rs"
required-features = ["ipc-bindings"]

# LocalAuthentication requires narrowly audited platform FFI in security/auth.rs.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
allow_attributes_without_reason = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openrows-monitor = { path = "../../../crates/openrows-monitor", features = ["ipc"] }
openrows-mcp = { path = "../../../crates/openrows-mcp", features = ["ipc-types"] }
arrow-array = "60"
arrow-schema = "60"
openrows-ai = { path = "../../../crates/openrows-ai", features = ["ipc-types"] }
openrows-core = { path = "../../../crates/openrows-core" }
openrows-driver-api = { path = "../../../crates/openrows-driver-api" }
openrows-driver-clickhouse = { path = "../../../crates/openrows-driver-clickhouse" }
openrows-driver-libsql = { path = "../../../crates/openrows-driver-libsql" }
openrows-driver-mssql = { path = "../../../crates/openrows-driver-mssql" }
openrows-driver-mysql = { path = "../../../crates/openrows-driver-mysql" }
openrows-driver-postgres = { path = "../../../crates/openrows-driver-postgres" }
openrows-driver-sqlite = { path = "../../../crates/openrows-driver-sqlite" }
openrows-dump = { path = "../../../crates/openrows-dump" }
openrows-explain = { path = "../../../crates/openrows-explain" }
openrows-export = { path = "../../../crates/openrows-export" }
openrows-import = { path = "../../../crates/openrows-import" }
openrows-host-client = { path = "../../../crates/openrows-host-client" }
openrows-net = { path = "../../../crates/openrows-net", features = ["helper-types"] }
openrows-results = { path = "../../../crates/openrows-results" }
openrows-schema = { path = "../../../crates/openrows-schema" }
openrows-secrets = { path = "../../../crates/openrows-secrets" }
openrows-sql = { path = "../../../crates/openrows-sql" }
openrows-store = { path = "../../../crates/openrows-store" }
openrows-types = { path = "../../../crates/openrows-types" }
serde = { workspace = true, features = ["derive"] }
tauri = { version = "2", features = ["specta", "macos-private-api"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
thiserror.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio = { version = "1.53", features = ["io-util", "net", "sync", "time"] }
tauri-plugin-window-state = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
regex = "1.13.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "json"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSApplication", "NSResponder", "NSWindow", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSError", "NSProcessInfo"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "time", "std"] }
