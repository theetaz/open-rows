[package]
name = "openrows-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenRows engine core: actor-per-session runtime, cancellation and query events"

[lints]
workspace = true

[dependencies]
arrow-array = "60"
arrow-schema = "60"
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-types = { path = "../openrows-types" }
thiserror.workspace = true
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"

[dev-dependencies]
openrows-driver-postgres = { path = "../openrows-driver-postgres" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
