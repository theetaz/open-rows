[package]
name = "openrows-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenRows engine core: actor-per-session runtime, cancellation, query events, scripts and safety gating"

[lints]
workspace = true

[dependencies]
arrow-array = "60"
arrow-schema = "60"
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-explain = { path = "../openrows-explain" }
openrows-export = { path = "../openrows-export" }
openrows-results = { path = "../openrows-results" }
openrows-sql = { path = "../openrows-sql" }
openrows-types = { path = "../openrows-types" }
thiserror.workspace = true
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1"

[dev-dependencies]
arrow-ipc = { version = "60", default-features = false }
openrows-driver-mysql = { path = "../openrows-driver-mysql" }
openrows-driver-postgres = { path = "../openrows-driver-postgres" }
openrows-driver-sqlite = { path = "../openrows-driver-sqlite" }
# Resilience tests cut and black-hole connections with the in-process `FaultyLink`.
openrows-net = { path = "../openrows-net", features = ["test-proxy"] }
tempfile = "3.27"
# `test-util`: keepalive and backoff tests run on paused, auto-advancing time.
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
