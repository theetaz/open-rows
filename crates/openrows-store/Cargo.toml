[package]
name = "openrows-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenRows local SQLite store and secret-free connection profiles"

[dependencies]
openrows-net = { path = "../openrows-net" }
openrows-secrets = { path = "../openrows-secrets" }
percent-encoding = "2.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url = "2.5"
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"
zeroize = "1.8"
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
