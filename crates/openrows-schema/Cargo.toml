[package]
name = "openrows-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenRows schema cache: lazily read catalog listings, persisted snapshots, invalidation and the name search index"

[dependencies]
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-store = { path = "../openrows-store" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
openrows-driver-mysql = { path = "../openrows-driver-mysql" }
openrows-driver-postgres = { path = "../openrows-driver-postgres" }
openrows-driver-sqlite = { path = "../openrows-driver-sqlite" }
openrows-net = { path = "../openrows-net" }
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt"] }

[lints]
workspace = true
