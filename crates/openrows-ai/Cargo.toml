[package]
name = "openrows-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tauri-free AI provider transports and metadata verification"

[lints]
workspace = true

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openrows-monitor = { path = "../openrows-monitor" }
openrows-sql = { path = "../openrows-sql" }
regex = "1"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
openrows-net = { path = "../openrows-net" }
openrows-secrets = { path = "../openrows-secrets" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
thiserror.workspace = true
# `process`/`io-util` drive the isolated Codex app-server child over stdio.
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
url = "2"

# Kill the Codex child's whole process group; already used by openrows-net/store/dump.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[features]
ipc-types = ["dep:specta"]

# Test double for `codex app-server`, used only by tests/codex_*.rs.
[[bin]]
name = "fake-codex"
path = "tests/fakes/codex_app_server.rs"
test = false
doc = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[[bench]]
name = "context_gate"
harness = false
