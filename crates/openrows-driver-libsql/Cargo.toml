[package]
name = "openrows-driver-libsql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "libSQL/Turso Hrana 3 HTTP driver over OpenRows network routes"

[lints]
workspace = true

[dependencies]
arrow-array = "60"
arrow-schema = "60"
base64 = "0.23"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-driver-sqlite = { path = "../openrows-driver-sqlite" }
openrows-monitor = { path = "../openrows-monitor" }
openrows-net = { path = "../openrows-net" }
openrows-sql = { path = "../openrows-sql" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53", features = ["net", "io-util", "sync", "time", "rt"] }
url = "2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
openrows-store = { path = "../openrows-store" }
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "decode_hrana"
harness = false

[[test]]
name = "remote"
path = "tests/remote/main.rs"
