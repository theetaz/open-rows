[package]
name = "openrows-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Streamed export of Arrow result batches to CSV, TSV, JSON, SQL INSERT, Markdown, Excel and Parquet files for OpenRows"

[lints]
workspace = true

[dependencies]
arrow-array = "60"
arrow-schema = "60"
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-sql = { path = "../openrows-sql" }
# Arrow writer with the pure-Rust Snappy codec only (no C libraries).
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
# Streaming (constant-memory) xlsx writer.
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
thiserror.workspace = true

[dev-dependencies]
# Reads written workbooks back in tests to check cell types.
calamine = "0.36"
tempfile = "3.27"
