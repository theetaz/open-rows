[package]
name = "openrows-driver-clickhouse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ClickHouse HTTP driver with native ArrowStream results over OpenRows routes"

[lints]
workspace = true

[dependencies]
arrow-array = "60"
arrow-ipc = { version = "60", features = ["lz4"] }
arrow-schema = "60"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-monitor = { path = "../openrows-monitor" }
openrows-net = { path = "../openrows-net" }
openrows-sql = { path = "../openrows-sql" }
serde_json.workspace = true
tokio = { version = "1.53", features = ["net", "io-util", "sync", "time", "rt"] }
uuid.workspace = true
url = "2"

[dev-dependencies]
openrows-net = { path = "../openrows-net", features = ["test-proxy"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
