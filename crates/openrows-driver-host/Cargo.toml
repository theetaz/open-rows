[package]
name = "openrows-driver-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Isolated OpenRows driver process lifecycle"

[lints]
workspace = true

[dependencies]
openrows-host-client = { path = "../openrows-host-client" }
openrows-driver-api = { path = "../openrows-driver-api" }
openrows-host-protocol = { path = "../openrows-host-protocol" }
tokio = { version = "1.53", features = ["io-util", "io-std", "net", "process", "rt-multi-thread", "sync", "time", "macros"] }
arrow-array = "60"
arrow-schema = "60"
arrow-ipc = "60"
arrow-ipc-58 = { package = "arrow-ipc", version = "58", optional = true }
duckdb = { version = "=1.10506.0", default-features = false, features = ["bundled"], optional = true }
openrows-driver-sqlite = { path = "../openrows-driver-sqlite", optional = true }
openrows-sql = { path = "../openrows-sql" }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "stdio", "fs"] }

[features]
default = []
duckdb = ["dep:duckdb", "dep:arrow-ipc-58"]
test-sqlite = ["dep:openrows-driver-sqlite"]
test-hooks = ["test-sqlite"]

# Match desktop checks' host build-dependency features before compiling bundled
# C++; these are feature-unification dependencies, not host runtime libraries.
[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "extra-traits", "fold", "visit", "visit-mut"] }

[package.metadata.cargo-machete]
ignored = ["tauri-build", "proc-macro2", "syn"]

[dev-dependencies]
arrow-cast = "60"
openrows-driver-conformance = { path = "../openrows-driver-conformance" }
openrows-core = { path = "../openrows-core" }
openrows-types = { path = "../openrows-types" }
openrows-results = { path = "../openrows-results" }
openrows-driver-host = { path = ".", features = ["test-hooks", "duckdb"] }
tempfile = "3.27"

[[bin]]
name = "host-test-fixture"
path = "tests/support/host.rs"
required-features = ["test-sqlite"]

[[bin]]
name = "host-duckdb-fixture"
path = "tests/support/duckdb_host.rs"
required-features = ["duckdb"]

[[bin]]
name = "host-parent-fixture"
path = "tests/support/parent.rs"
required-features = ["test-hooks"]

[[bin]]
name = "host-mismatch-fixture"
path = "tests/support/mismatch.rs"
required-features = ["test-hooks"]

[[bench]]
name = "host_startup"
harness = false

[[bench]]
name = "host_batch_transport"
harness = false
required-features = ["test-hooks"]

[[bench]]
name = "host_stream_throughput"
harness = false
required-features = ["test-sqlite"]

[[bench]]
name = "host_backpressure_memory"
harness = false
required-features = ["test-hooks"]
