name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '3'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check version and install target
        run: |
          node -e 'const fs=require("node:fs"), assert=require("node:assert/strict"), cp=require("node:child_process"); const config=JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json")); const desktop=JSON.parse(fs.readFileSync("apps/desktop/package.json")); const metadata=JSON.parse(cp.execFileSync("cargo", ["metadata", "--no-deps", "--locked", "--format-version", "1"])); assert.equal(desktop.version, config.version); assert.equal(process.env.RELEASE_TAG, "v" + config.version); assert.equal(metadata.packages.find(p => p.name === "openrows-app").version, config.version)'
          rustup target add '${{ matrix.target }}'
      - name: Build, sign, notarize and collect
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?Developer ID certificate required}"
          : "${APPLE_SIGNING_IDENTITY:?Developer ID identity required}"
          if [[ "$APPLE_SIGNING_IDENTITY" == - ]]; then
            printf 'Production releases require Developer ID signing, not ad-hoc signing\n' >&2
            exit 1
          fi
          : "${TAURI_SIGNING_PRIVATE_KEY:?Updater signing key required}"
          : "${TAURI_SIGNING_PUBLIC_KEY:?Pinned updater public key required}"
          if [[ -n "$APPLE_API_PRIVATE_KEY" ]]; then
            : "${APPLE_API_ISSUER:?App Store Connect issuer required}"
            : "${APPLE_API_KEY:?App Store Connect key ID required}"
          else
            : "${APPLE_ID:?Apple ID required}"
            : "${APPLE_TEAM_ID:?Apple Team ID required}"
            : "${APPLE_PASSWORD:?App-specific password required}"
          fi
          source scripts/release-credentials.sh
          bash scripts/release-macos.sh release '${{ matrix.target }}'
          bash scripts/notarize-dmg.sh "$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle/dmg/"*.dmg
          python3 -B scripts/release-artifacts.py prepare "$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle" release-assets '${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release and upload assets
        run: |
          args=(--verify-tag --draft --generate-notes)
          version_core="${RELEASE_TAG%%+*}"
          if [[ "$version_core" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              printf 'Refusing to overwrite a published release: %s\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.txt
          python3 -B scripts/release-artifacts.py manifest release-assets "${RELEASE_TAG#v}" "$GITHUB_REPOSITORY" release-notes.txt
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          if [[ "$version_core" == *-* ]]; then
            gh release view update-beta || gh release create update-beta --target "$(git rev-parse HEAD)" --prerelease --title "Beta update feed" --notes "Signed beta channel manifest"
            gh release upload update-beta release-assets/beta.json --clobber
          fi
