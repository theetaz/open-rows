name: CI

# Minimal pipeline while the repository is private. The full pipeline
# (Linux/macOS/Windows matrix, supply-chain, hygiene and an aggregate
# required check) returns when the repository goes public; see
# docs/18-repository-and-dev-workflow.md §4. Run `just check` locally for
# every gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          message=$(mktemp)
          trap 'rm -f -- "$message"' EXIT
          printf '%s\n' "$PR_TITLE" > "$message"
          bash scripts/git-hooks/commit-msg "$message"
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend format
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Component tests
        run: pnpm test
      - name: Frontend dead code
        run: pnpm knip
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --locked
      - name: Binding freshness
        run: cargo nextest run -p openrows-app --locked bindings_are_fresh
