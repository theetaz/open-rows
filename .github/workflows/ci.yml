name: CI

# Runs only on pushes to `main` (squash-merged PRs) and on manual dispatch.
# Feature branches and pull requests do not trigger CI: run `just check`
# locally before pushing. Documentation-only pushes are skipped. All jobs
# run in parallel so the wall-clock time is the slowest job, not the sum.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

# A running check on main always finishes (and saves the Rust cache);
# pushes that land meanwhile queue, and only the newest queued run is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  frontend:
    # Node-only checks, in parallel with the Rust job: no Rust toolchain,
    # no system packages, no disk cleanup.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend format
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Component tests
        run: pnpm test --maxWorkers=4
      - name: Frontend dead code
        run: pnpm knip

  check:
    runs-on: ubuntu-latest
    # Cold GitHub check measured ~41m with native DuckDB; cached runs are far shorter (docs/18 §4).
    timeout-minutes: 50
    env:
      # Full debug info for every crate fills the runner's disk; line tables
      # keep panic backtraces readable at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TARGET_DIR: target
      CARGO_BUILD_JOBS: '4'
      NEXTEST_TEST_THREADS: '4'
    steps:
      - name: Free runner disk
        # Deleting preinstalled SDKs takes ~90 s; run it in the background
        # while dependencies install, long before the build needs the space.
        run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Select shared native Cargo target and linker
        # Ubuntu's preinstalled LLVM linker avoids concurrent GNU-link memory spikes.
        run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
          linker=$(command -v ld.lld || command -v ld.lld-18)
          echo "RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=$linker" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          key: check-native-${{ env.CARGO_BUILD_TARGET }}
          cache-on-failure: true
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Stage production driver host for desktop checks
        # All steps share target/<host-triple>/debug and the same native profile;
        # separately named fixtures cannot overwrite the staged production image.
        run: bash scripts/stage-host.sh dev
      - name: Check driver host staging isolation
        run: python3 -B -m unittest discover -s scripts -p 'test_stage_host.py'
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features openrows-app/ipc-bindings -- -D warnings
      - name: Tests
        # Docker-backed SSH container tests run locally in `just check`;
        # building their fixture image here costs minutes per run. The
        # bindings_are_fresh test in openrows-app runs here too.
        run: cargo nextest run --workspace --locked --features openrows-app/ipc-bindings -E 'not binary(ssh_container)'

  containers:
    # PostgreSQL 17, MySQL 8.4 and MariaDB 11.4 in throwaway containers: the
    # driver integration tests and the driver conformance suite (M1-30). Its
    # own runner, so the disk-heavy app build above is not shared; only the
    # driver, core and schema crates are compiled here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # A missing Docker daemon fails the job instead of skipping the suites.
      OPENROWS_REQUIRE_DOCKER: '1'
    steps:
      - name: Free runner disk
        run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      - name: PostgreSQL suites
        run: bash scripts/test-pg.sh 17
      - name: MySQL and MariaDB suites
        run: bash scripts/test-mysql.sh

  tier2:
    # Tier 2 server conformance (M2-25): SQL Server 2022, ClickHouse LTS and
    # authenticated libSQL/Turso sqld, one throwaway container per matrix leg
    # on its own runner. DuckDB (driver host) and libSQL file conformance need
    # no server and run in the `check` job's workspace tests.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [mssql, clickhouse, libsql]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      OPENROWS_REQUIRE_DOCKER: '1'
    steps:
      - name: Free runner disk
        run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tier2-${{ matrix.suite }}
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      - name: ${{ matrix.suite }} suites
        # x86_64 runners use the default official images of each script.
        run: bash scripts/test-${{ matrix.suite }}.sh
