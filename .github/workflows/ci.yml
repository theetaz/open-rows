name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          message=$(mktemp)
          trap 'rm -f -- "$message"' EXIT
          printf '%s\n' "$PR_TITLE" > "$message"
          bash scripts/git-hooks/commit-msg "$message"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and components
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo nextest run --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Check advisories, licences, bans and sources
        run: cargo deny --locked check
      - name: Check unused dependencies
        run: cargo machete

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: shellcheck
          fallback: none
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
      - name: Source hygiene
        run: bash scripts/check-hygiene.sh
      - name: Shell scripts
        run: |
          mapfile -d '' scripts < <(find scripts -type f \( -name '*.sh' -o -path 'scripts/git-hooks/*' \) -print0)
          shellcheck "${scripts[@]}"
      - name: Workflows
        run: actionlint .github/workflows/*.yml

  ci-ok:
    runs-on: ubuntu-latest
    needs: [commits, rust, supply-chain, hygiene]
    if: always()
    steps:
      - name: Require successful gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
        run: |
          [[ "$RUST_RESULT" == success ]]
          [[ "$SUPPLY_CHAIN_RESULT" == success ]]
          [[ "$HYGIENE_RESULT" == success ]]
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$COMMITS_RESULT" == success ]]
          else
            [[ "$COMMITS_RESULT" == skipped ]]
          fi
