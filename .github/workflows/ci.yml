name: CI

# Runs only on pushes to `main` (squash-merged PRs) and on manual dispatch.
# Feature branches and pull requests do not trigger CI: run `just check`
# locally before pushing. This keeps free GitHub Actions minutes for the
# integration gate on `main`. The full pipeline returns when the project
# goes public; see docs/18-repository-and-dev-workflow.md §4.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Full debug info for every crate fills the runner's disk; line tables
      # keep panic backtraces readable at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend format
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Component tests
        run: pnpm test
      - name: Frontend dead code
        run: pnpm knip
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.146
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        # Docker-backed SSH container tests run locally in `just check`;
        # building their fixture image here costs minutes per run.
        run: cargo nextest run --workspace --locked -E 'not binary(ssh_container)'
      - name: Binding freshness
        run: cargo nextest run -p openrows-app --locked bindings_are_fresh
