name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Connections, Schema browser, Query editor, Data grid, Data editing, Import/Export, API client, AI assistant / MCP, Networking, Settings, Other]
    validations:
      required: true
