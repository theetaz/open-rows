[graph]
# Only the desktop targets OpenRows ships (docs/16). Without this, wasm-only
# dependencies (e.g. webpki-root-certs under rustls-platform-verifier, CDLA
# data licence) would be checked although no shipped binary contains them.
targets = [
    "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
]

[advisories]
# Vulnerabilities are errors by default; do not ignore any advisories.
yanked = "deny"
# Unmaintained notices fail only for crates we depend on directly; transitive
# ones (e.g. paste, proc-macro-error via specta/tauri) are tracked upstream.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0",
]
# All other licences, including strong copyleft, are denied by default.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
