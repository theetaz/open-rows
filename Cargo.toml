[workspace]
members = [
    "crates/openrows-types",
    "crates/openrows-ai",
    "crates/openrows-mcp",
    "crates/openrows-core",
    "crates/openrows-monitor",
    "crates/openrows-results",
    "crates/openrows-explain",
    "crates/openrows-export",
    "crates/openrows-import",
    "crates/openrows-dump",
    "crates/openrows-driver-api",
    "crates/openrows-driver-conformance",
    "crates/openrows-driver-libsql",
    "crates/openrows-driver-mssql",
    "crates/openrows-driver-clickhouse",
    "crates/openrows-driver-mysql",
    "crates/openrows-driver-postgres",
    "crates/openrows-driver-sqlite",
    "crates/openrows-net",
    "crates/openrows-host-protocol",
    "crates/openrows-host-client",
    "crates/openrows-driver-host",
    "crates/openrows-schema",
    "crates/openrows-sql",
    "crates/openrows-secrets",
    "crates/openrows-store",
    "apps/desktop/src-tauri",
]
# fuzz/ is its own cargo-fuzz workspace (nightly only); run it with `just fuzz-smoke`.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/theetaz/open-rows"
rust-version = "1.94"

[workspace.dependencies]
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Bundled C++ debug symbols dominate development build/link I/O. Keep its
# development optimisation off; release retains the normal optimised profile.
[profile.dev.package.libduckdb-sys]
debug = false
opt-level = 0
